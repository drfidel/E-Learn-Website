version: '3.9'
services:
  web:
    build: .
    command: gunicorn elearn.wsgi:application --bind 0.0.0.0:8000
    volumes:
      - .:/app
    env_file:
      - .env.example
    depends_on:
      - db
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: elearn
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
  nginx:
    image: nginx:1.27
    ports:
      - '80:80'
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - web
volumes:
  postgres_data:
