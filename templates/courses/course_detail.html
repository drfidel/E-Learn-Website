{% extends 'base/base.html' %}
{% block content %}
<h2>{{ course.title }}</h2>
<p>{{ course.description }}</p>
<p>Instructor: {{ course.instructor.username }}</p>
<p>Price: ${{ course.price }}</p>
{% if user.is_authenticated %}
<a class="btn btn-success" href="/payments/initiate/{{ course.id }}/">Enroll / Buy</a>
<form class="mt-3" method="post" action="/reviews/add/{{ course.id }}/">{% csrf_token %}
  <input class="form-control mb-2" type="number" min="1" max="5" name="rating" placeholder="Rating (1-5)">
  <textarea class="form-control mb-2" name="comment" placeholder="Comment"></textarea>
  <button class="btn btn-outline-primary">Submit review</button>
</form>
{% endif %}
{% endblock %}
