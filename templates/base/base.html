<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>E-Learning Platform</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-light bg-light">
  <div class="container">
    <a class="navbar-brand" href="/">E-Learn</a>
    <div>
      {% if user.is_authenticated %}
      <a class="btn btn-outline-primary btn-sm" href="/accounts/profile/">Profile</a>
      {% else %}
      <a class="btn btn-primary btn-sm" href="/accounts/login/">Login</a>
      {% endif %}
    </div>
  </div>
</nav>
<div class="container py-4">{% block content %}{% endblock %}</div>
</body>
</html>
